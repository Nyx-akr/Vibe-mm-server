services:
  - type: web
    name: vibescreener-server
    runtime: node
    plan: free
    # Remove `rootDir` if this folder is the root of its own repository.
    rootDir: vibescreener-server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
